const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");

let W, H, DPR, groundY;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(innerWidth * DPR);
  canvas.height = Math.floor(innerHeight * DPR);
  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  W = innerWidth;
  H = innerHeight;
  groundY = H * 0.72;
}
addEventListener("resize", resize);
resize();

let bestScore = Number(localStorage.getItem("dragonStickBestPremium") || 0);

function resetGame(){
  game = {
    state:"playing",
    level:1,
    lives:3,
    totalSurvive:0,
    levelTime:0,
    score:0,
    hitCooldown:0,
    levelMessageTime:0,
    deathPose:false,
    flash:0,
    spawnFire:1.8,
    spawnRock:4.5,
    spawnSpike:5.2,
    spawnGhost:9.5,
    fires:[],
    rocks:[],
    spikes:[],
    ghosts:[],
    sparks:[],
    player:{x:W*0.20,y:groundY,vx:0,vy:0,w:46,h:92,onGround:true}
  };
}

function startGame(){
  overlay.style.display = "none";
  resetGame();
  last = performance.now();
  requestAnimationFrame(loop);
}

function showPanel(title, body, btn="Tekrar Oyna"){
  overlay.style.display = "flex";
  panel.innerHTML = `<h1>${title}</h1><p>${body}</p><p class="small">Rekor Puan: ${bestScore}</p><button onclick="startGame()">${btn}</button>`;
}

addEventListener("keydown", e=>{
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a") keys.left=true;
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d") keys.right=true;
  if(e.code==="Space"||e.key==="ArrowUp"||e.key.toLowerCase()==="w") keys.jump=true;
});
addEventListener("keyup", e=>{
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a") keys.left=false;
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d") keys.right=false;
  if(e.code==="Space"||e.key==="ArrowUp"||e.key.toLowerCase()==="w") keys.jump=false;
});

document.querySelectorAll(".ctrl").forEach(btn=>{
  const k=btn.dataset.key;
  const down=e=>{e.preventDefault();keys[k]=true;};
  const up=e=>{e.preventDefault();keys[k]=false;};
  btn.addEventListener("touchstart",down,{passive:false});
  btn.addEventListener("touchend",up,{passive:false});
  btn.addEventListener("touchcancel",up,{passive:false});
  btn.addEventListener("mousedown",down);
  btn.addEventListener("mouseup",up);
  btn.addEventListener("mouseleave",up);
});

function loop(t){
  const dt = Math.min((t-last)/1000, 0.033);
  last = t;
  update(dt);
  draw();
  if(game && game.state==="playing") requestAnimationFrame(loop);
}

function difficulty(){
  return 0.72 + (game.level-1)*0.14;
}

function update(dt){
  const p = game.player;
  const diff = difficulty();

  game.totalSurvive += dt;
  game.levelTime += dt;
  game.score = Math.floor(game.totalSurvive * 10);
  game.hitCooldown = Math.max(0, game.hitCooldown - dt);
  game.levelMessageTime = Math.max(0, game.levelMessageTime - dt);
  game.flash = Math.max(0, game.flash - dt);

  p.vx = 0;
  const speed = 255;
  if(keys.left) p.vx = -speed;
  if(keys.right) p.vx = speed;
  if(keys.jump && p.onGround){
    p.vy = -630;
    p.onGround = false;
  }
  p.vy += 1450 * dt;
  p.x += p.vx * dt;
  p.y += p.vy * dt;
  p.x = Math.max(40, Math.min(W-70, p.x));
  if(p.y >= groundY){
    p.y = groundY;
    p.vy = 0;
    p.onGround = true;
  }

  game.spawnFire -= dt;
  if(game.spawnFire <= 0){
    game.spawnFire = Math.max(0.85, 2.35 - game.level*0.11);
    game.fires.push({x:W-150,y:groundY-115+Math.random()*70,vx:-(210+game.level*18),r:18+Math.random()*9});
  }

  game.spawnRock -= dt;
  if(game.spawnRock <= 0){
    game.spawnRock = Math.max(1.45, 4.8 - game.level*0.22);
    game.rocks.push({x:90+Math.random()*(W-180),y:-40,vy:160+game.level*24,r:19+Math.random()*13,rot:0});
  }

  game.spawnSpike -= dt;
  if(game.spawnSpike <= 0){
    game.spawnSpike = Math.max(1.65, 5.6 - game.level*0.28);
    game.spikes.push({x:W+60,y:groundY,w:46,h:46,vx:-(135+game.level*18)});
  }

  game.spawnGhost -= dt;
  if(game.level>=2 && game.spawnGhost<=0){
    game.spawnGhost = Math.max(2.4, 8.8 - game.level*0.42);
    game.ghosts.push({x:W+70,y:groundY-135-Math.random()*90,r:26,vx:-(105+game.level*14),wave:Math.random()*10});
  }

  game.fires.forEach(o=>{o.x += o.vx*dt*diff; createSpark(o.x,o.y,2);});
  game.rocks.forEach(o=>{o.y += o.vy*dt*diff; o.rot += dt*3;});
  game.spikes.forEach(o=>o.x += o.vx*dt*diff);
  game.ghosts.forEach(o=>{o.x += o.vx*dt*diff; o.wave+=dt*5; o.y+=Math.sin(o.wave)*.65;});
  game.sparks.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;});

  game.fires = game.fires.filter(o=>o.x>-90);
  game.rocks = game.rocks.filter(o=>o.y<H+90);
  game.spikes = game.spikes.filter(o=>o.x>-90);
  game.ghosts = game.ghosts.filter(o=>o.x>-90);
  game.sparks = game.sparks.filter(s=>s.life>0);

  const pb = {x:p.x-p.w/2,y:p.y-p.h,w:p.w,h:p.h};
  const hazards = [
    ...game.fires.map(o=>({x:o.x-o.r,y:o.y-o.r,w:o.r*2,h:o.r*2})),
    ...game.rocks.map(o=>({x:o.x-o.r,y:o.y-o.r,w:o.r*2,h:o.r*2})),
    ...game.spikes.map(o=>({x:o.x-o.w/2,y:o.y-o.h,w:o.w,h:o.h})),
    ...game.ghosts.map(o=>({x:o.x-o.r,y:o.y-o.r,w:o.r*2,h:o.r*2}))
  ];
  if(game.hitCooldown<=0 && hazards.some(h=>collide(pb,h))) loseLife();

  if(game.levelTime >= 60){
    if(game.level >= 10) winGame();
    else nextLevel();
  }
}

function createSpark(x,y,n){
  for(let i=0;i<n;i++){
    if(Math.random()<.5) game.sparks.push({x,y,vx:-40-Math.random()*120,vy:(Math.random()-.5)*80,life:.28+Math.random()*.25,size:1+Math.random()*3});
  }
}

function collide(a,b){return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;}

function loseLife(){
  game.lives--;
  game.hitCooldown = 1.45;
  game.flash = .22;
  game.fires=[];game.rocks=[];game.spikes=[];game.ghosts=[];
  game.player.x=W*.20;game.player.y=groundY;game.player.vy=0;
  if(game.lives<=0) endGame();
}

function endGame(){
  game.state="ended";
  game.deathPose=true;
  bestScore=Math.max(bestScore,game.score);
  localStorage.setItem("dragonStickBestPremium",bestScore);
  draw();
  setTimeout(()=>showPanel("Oyun Bitti",`Toplam süre: ${Math.floor(game.totalSurvive)} saniye<br>Puanın: ${game.score}`),900);
}

function nextLevel(){
  game.level++;
  game.levelTime=0;
  game.levelMessageTime=2.4;
  game.fires=[];game.rocks=[];game.spikes=[];game.ghosts=[];
  game.player.x=W*.20;game.player.y=groundY;game.player.vy=0;
  game.hitCooldown=1.5;
}

function winGame(){
  game.state="won";
  bestScore=Math.max(bestScore,game.score);
  localStorage.setItem("dragonStickBestPremium",bestScore);
  draw();
  setTimeout(()=>showPanel("Tebrikler!",`10 seviyeyi de tamamladın!<br>Toplam süre: ${Math.floor(game.totalSurvive)} saniye<br>Puanın: ${game.score}`,"Yeniden Oyna"),800);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawBackground();
  if(game && game.state==="won") drawVictoryScene();
  else if(game){
    drawDragon();
    drawHazards();
    drawPlayer();
  }
  drawHUD();
  if(game && game.levelMessageTime>0) drawLevelMessage();
  if(game && game.flash>0){ctx.fillStyle=`rgba(220,38,38,${game.flash*1.6})`;ctx.fillRect(0,0,W,H);}
}

function drawBackground(){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#061225");sky.addColorStop(.48,"#15284b");sky.addColorStop(.72,"#201c2f");sky.addColorStop(1,"#07110d");
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.globalAlpha=.25;
  for(let i=0;i<70;i++){ctx.fillStyle=i%5===0?"#fb923c":"#e0f2fe";ctx.fillRect((i*127)%W,30+(i*53)%(H*.55),2,2);}
  ctx.restore();

  ctx.fillStyle="rgba(219,234,254,.8)";
  ctx.beginPath();ctx.arc(W*.36,H*.13,42,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="rgba(2,6,23,.20)";
  ctx.beginPath();ctx.arc(W*.35,H*.12,12,0,Math.PI*2);ctx.arc(W*.375,H*.15,9,0,Math.PI*2);ctx.fill();

  drawCastle(W*.08,groundY-40,.55);
  drawCastle(W*.72,groundY-55,.40);

  drawPlatform(0,groundY,W,H-groundY);
}

function drawCastle(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle="rgba(8,13,28,.78)";
  ctx.fillRect(0,-210,90,210);ctx.fillRect(80,-280,110,280);ctx.fillRect(180,-170,80,170);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(80+i*45,-280);ctx.lineTo(102+i*45,-335);ctx.lineTo(125+i*45,-280);ctx.fill();}
  ctx.fillStyle="rgba(251,146,60,.55)";
  for(let i=0;i<8;i++) ctx.fillRect(25+(i%4)*45,-210+Math.floor(i/4)*70,12,28);
  ctx.restore();
}

function drawPlatform(x,y,w,h){
  ctx.fillStyle="#1b1f25";ctx.fillRect(x,y,w,h);
  for(let i=0;i<w/70+2;i++){
    const bx=x+i*70-10;
    const by=y+((i%2)*6);
    ctx.fillStyle=i%2?"#2b2f36":"#242832";
    roundRect(bx,by,76,34,6,true);
    ctx.strokeStyle="rgba(251,191,36,.12)";ctx.stroke();
  }
  ctx.fillStyle="#365314";ctx.fillRect(x,y-8,w,9);
  ctx.fillStyle="rgba(251,146,60,.32)";
  for(let i=0;i<w/50;i++) ctx.fillRect(x+i*50,y-2,18,3);
}

function drawHUD(){
  if(!game)return;
  drawPanel(16,16,230,88);
  drawAvatar(52,58,36);
  ctx.font="bold 30px Arial";ctx.fillStyle="#ef4444";
  ctx.fillText("♥".repeat(game.lives),98,57);
  ctx.font="bold 17px Arial";ctx.fillStyle="#fff";ctx.fillText("CAN: "+game.lives,100,88);

  drawPanel(W/2-105,18,210,82);
  ctx.font="bold 30px Arial";ctx.fillStyle="#fff";ctx.textAlign="center";
  ctx.fillText(formatTime(game.levelTime),W/2,54);
  ctx.font="bold 18px Arial";ctx.fillStyle="#b5ff67";ctx.fillText("LEVEL "+game.level+" / 10",W/2,84);
  ctx.textAlign="left";

  drawPanel(W-180,18,160,102);
  ctx.font="bold 15px Arial";ctx.fillStyle="#fef3c7";ctx.fillText("PUAN",W-146,47);
  ctx.font="bold 31px Arial";ctx.fillStyle="#fbbf24";ctx.fillText(game.score,W-146,82);
  ctx.font="bold 14px Arial";ctx.fillStyle="#fef3c7";ctx.fillText("REKOR: "+bestScore,W-146,108);

  drawPanel(16,H-126,Math.min(W-32,760),104);
  ctx.font="bold 17px Arial";ctx.fillStyle="#fbbf24";ctx.fillText("⭐ SEVİYE HEDEFİ",34,H-92);
  ctx.font="bold 14px Arial";ctx.fillStyle="#fff";ctx.fillText("1 DAKİKA DAYAN  •  Alevlerden, taşlardan, dikenlerden ve hayaletlerden kaç.",34,H-62);
  ctx.fillStyle="#172554";roundRect(34,H-44,240,18,9,true);
  ctx.fillStyle="#84cc16";roundRect(34,H-44,240*Math.min(game.levelTime/60,1),18,9,true);
  ctx.strokeStyle="rgba(255,255,255,.35)";roundRect(34,H-44,240,18,9,false);
}

function drawPanel(x,y,w,h){
  ctx.save();
  ctx.fillStyle="rgba(3,7,18,.78)";
  ctx.strokeStyle="rgba(255,211,106,.55)";
  ctx.lineWidth=2;
  roundRect(x,y,w,h,15,true);roundRect(x,y,w,h,15,false);
  ctx.restore();
}

function drawAvatar(x,y,r){
  ctx.save();
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();
  ctx.drawImage(headImg,x-r,y-r,r*2,r*2);
  ctx.restore();
  ctx.strokeStyle="#ffd36a";ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
}

function drawDragon(){
  const bob=Math.sin(game.totalSurvive*2.5)*8;
  const x=W-205,y=groundY-230+bob;
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(.48,.48);
  ctx.shadowColor="rgba(251,146,60,.9)";
  ctx.shadowBlur=22;
  ctx.drawImage(dragonImg,-260,-230,520,520);
  ctx.restore();

  const mouthX=x-80,mouthY=y-35;
  const targetX=game.player.x+20,targetY=game.player.y-42;
  const grad=ctx.createLinearGradient(mouthX,mouthY,targetX,targetY);
  grad.addColorStop(0,"rgba(255,243,150,.95)");
  grad.addColorStop(.35,"rgba(249,115,22,.82)");
  grad.addColorStop(1,"rgba(239,68,68,.08)");
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.moveTo(mouthX,mouthY-16);
  ctx.quadraticCurveTo((mouthX+targetX)/2,mouthY+40,targetX,targetY-28);
  ctx.quadraticCurveTo((mouthX+targetX)/2,mouthY+82,mouthX,mouthY+16);
  ctx.closePath();ctx.fill();
}

function drawHazards(){
  game.fires.forEach(o=>{
    ctx.fillStyle="#fb923c";ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fde047";ctx.beginPath();ctx.arc(o.x-5,o.y-3,o.r*.55,0,Math.PI*2);ctx.fill();
  });

  game.rocks.forEach(o=>{
    ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);
    ctx.fillStyle="#78716c";ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.18)";ctx.beginPath();ctx.arc(-6,-7,o.r*.35,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });

  game.spikes.forEach(o=>{
    for(let i=0;i<3;i++){
      const sx=o.x-o.w/2+i*18;
      const grd=ctx.createLinearGradient(sx,o.y-o.h,sx,o.y);
      grd.addColorStop(0,"#fef3c7");grd.addColorStop(1,"#78350f");
      ctx.fillStyle=grd;
      ctx.beginPath();ctx.moveTo(sx,o.y);ctx.lineTo(sx+9,o.y-o.h);ctx.lineTo(sx+18,o.y);ctx.closePath();ctx.fill();
    }
  });

  game.ghosts.forEach(o=>{
    ctx.save();ctx.shadowColor="#a855f7";ctx.shadowBlur=20;
    ctx.fillStyle="rgba(168,85,247,.74)";
    ctx.beginPath();ctx.arc(o.x,o.y,o.r,Math.PI,0);ctx.lineTo(o.x+o.r,o.y+o.r);ctx.lineTo(o.x-o.r,o.y+o.r);ctx.closePath();ctx.fill();
    ctx.fillStyle="#111827";ctx.beginPath();ctx.arc(o.x-8,o.y-1,3,0,Math.PI*2);ctx.arc(o.x+8,o.y-1,3,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });

  game.sparks.forEach(s=>{
    ctx.fillStyle=`rgba(251,146,60,${Math.max(0,s.life*3)})`;
    ctx.fillRect(s.x,s.y,s.size,s.size);
  });
}

function drawPlayer(){
  const p=game.player;
  const x=p.x,y=p.y;
  const isDead=game.deathPose || game.state==="ended";
  const isHappy=game.levelMessageTime>0 || game.state==="won";
  const moving=Math.abs(p.vx)>1 && p.onGround && !isDead;
  const run=moving?Math.sin(game.totalSurvive*14):0;
  const arm=run*18,leg=run*18;
  const blink=game.hitCooldown>0 && Math.floor(game.hitCooldown*10)%2===0 && !isDead;
  if(blink)ctx.globalAlpha=.45;

  if(isDead){
    ctx.save();ctx.translate(x,y-22);ctx.rotate(-.38);drawStick(0,0,0,0,"dead");ctx.restore();ctx.globalAlpha=1;return;
  }
  drawStick(x,y,arm,leg,isHappy?"happy":"normal");
  ctx.globalAlpha=1;
}

function drawStick(x,y,arm,leg,face){
  ctx.save();
  ctx.strokeStyle="#030712";ctx.lineWidth=10;ctx.lineCap="round";
  bodyLines(x,y,arm,leg);
  ctx.strokeStyle="#111827";ctx.lineWidth=6;bodyLines(x,y,arm,leg);
  ctx.restore();

  // Kafa görseli ARTIK KESİLMİYOR.
  // Daire clip kaldırıldı; görselin tamamı çöp adamın başında görünür.
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,.65)";
  ctx.shadowBlur=12;
  ctx.shadowOffsetY=5;

  const headW = 76;
  const headH = 112;
  const headX = x - headW / 2;
  const headY = y - 126;

  if(face==="dead"){
    ctx.translate(x, y - 70);
    ctx.rotate(-.15);
    ctx.drawImage(headImg, -headW/2, -headH/2, headW, headH);
  } else {
    const bob = Math.sin(game.totalSurvive * 14) * 1.5;
    ctx.drawImage(headImg, headX, headY + bob, headW, headH);
  }
  ctx.restore();

  if(face==="dead") drawDeadFace(x,y-70);
}

function bodyLines(x,y,arm,leg){
  ctx.beginPath();ctx.moveTo(x,y-44);ctx.lineTo(x,y-25);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,y-39);ctx.lineTo(x-23-arm*.35,y-28+arm*.15);ctx.moveTo(x,y-39);ctx.lineTo(x+23+arm*.35,y-28-arm*.15);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,y-25);ctx.lineTo(x-20-leg*.3,y);ctx.moveTo(x,y-25);ctx.lineTo(x+20+leg*.3,y);ctx.stroke();
}

function drawDeadFace(x,y){
  ctx.save();ctx.strokeStyle="#111827";ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(x-11,y-5);ctx.lineTo(x-4,y+2);ctx.moveTo(x-4,y-5);ctx.lineTo(x-11,y+2);
  ctx.moveTo(x+4,y-5);ctx.lineTo(x+11,y+2);ctx.moveTo(x+11,y-5);ctx.lineTo(x+4,y+2);
  ctx.stroke();
  ctx.beginPath();ctx.arc(x,y+12,7,Math.PI,0,true);ctx.stroke();
  ctx.restore();
}

function drawLevelMessage(){
  ctx.save();
  ctx.globalAlpha=Math.min(1,game.levelMessageTime);
  ctx.fillStyle="rgba(20,83,45,.84)";
  ctx.strokeStyle="rgba(190,242,100,.8)";
  roundRect(W/2-230,H*.22,460,92,18,true);roundRect(W/2-230,H*.22,460,92,18,false);
  ctx.textAlign="center";ctx.font="bold 30px Arial";ctx.fillStyle="#bef264";
  ctx.fillText("SEVİYE GEÇİLDİ!",W/2,H*.22+38);
  ctx.font="bold 18px Arial";ctx.fillStyle="#fff";
  ctx.fillText("Çöp adam gülümsüyor. Yeni seviye daha zor!",W/2,H*.22+68);
  ctx.textAlign="left";ctx.restore();
}

function drawVictoryScene(){
  drawPlatform(0,groundY,W,H-groundY);
  const x=W*.43,y=groundY;
  drawStick(x,y,30,-30,"happy");

  ctx.fillStyle="#facc15";ctx.strokeStyle="#92400e";ctx.lineWidth=3;
  ctx.fillRect(x+30,y-145,42,35);ctx.strokeRect(x+30,y-145,42,35);
  ctx.fillRect(x+43,y-110,15,24);ctx.fillRect(x+25,y-86,52,8);
  ctx.strokeStyle="#facc15";ctx.lineWidth=5;
  ctx.beginPath();ctx.arc(x+26,y-130,13,Math.PI/2,Math.PI*1.5);ctx.arc(x+76,y-130,13,-Math.PI/2,Math.PI/2);ctx.stroke();

  const dx=W*.70,dy=groundY-18;
  ctx.save();ctx.translate(dx,dy);ctx.rotate(.08);ctx.scale(.40,.40);
  ctx.globalAlpha=.92;ctx.drawImage(dragonImg,-260,-110,520,520);ctx.restore();
  ctx.strokeStyle="#111827";ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(dx-24,dy-8);ctx.lineTo(dx-6,dy+10);ctx.moveTo(dx-6,dy-8);ctx.lineTo(dx-24,dy+10);ctx.stroke();

  ctx.textAlign="center";ctx.font="bold 42px Arial";ctx.fillStyle="#ffd36a";ctx.fillText("TÜM SEVİYELER TAMAMLANDI!",W/2,H*.18);
  ctx.font="bold 28px Arial";ctx.fillText("TEBRİKLER!",W/2,H*.18+44);ctx.textAlign="left";
}

function roundRect(x,y,w,h,r,fill){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  if(fill)ctx.fill();else ctx.stroke();
}

function formatTime(s){
  const m=Math.floor(s/60),sec=Math.floor(s%60),cs=Math.floor((s%1)*100);
  return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0")+"."+String(cs).padStart(2,"0");
}
</script>
